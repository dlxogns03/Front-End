<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <script type="text/javascript">
      onload = function () {
        //."button"을 찾아서 클릭이벤트를 할당한다.(2개)
        const buttons = document.querySelectorAll(".button");

        //buttons를 반복.
        buttons.forEach(function (eachButton) {
          eachButton.onclick = function (event) {
            //클릭한 버튼의 부모중 ".box"를 찾는다
            //   closest => 가장 인접한 부모중에 (".box ")를 찾아와라
            //   const box = event.target.closest(".box");
            //   or
            const box = this.closest(".box");
            console.log(box);

            //box에서 datte-name가져온다.

            const name = box.dataset.name;
            console.log(name);

            //클릭한 버튼의 box에서 .area를 찾는다 .
            const area = box.querySelector(".area");
            console.log(area);
          };
        });
      };
    </script>
  </head>
  <body>
    <div class="box" data-name="첫 번째 박스">
      <div class="item">
        <div class="content">asdfasdfasgaethath</div>
        <div class="area">
          <div>
            <button class="button">버튼</button>
          </div>
        </div>
      </div>
    </div>
    <div class="box" data-name="두 번째 박스">
      <div class="item">
        <div class="content">asdfasdfasgaethath</div>
        <div class="area">
          <div>
            <button class="button">버튼</button>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
