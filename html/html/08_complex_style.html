<!doctype html>
<html>
  <head>
    <title>External Style실습</title>
    <!-- external Style : 우선 순위가 가장 낮다. -->
    <link
      type="text/css"
      rel="stylesheet"
      href="../css/05_external_style.css"
    />

    <!-- Internal Style : 우선순위가 External Style 보다 높다  -->
    <style type="text/css">
      div {
        font-size: 0.5rem; /*8 px*/
      }
    </style>
  </head>
  <body>
    <!-- Inline Style : 우선순위가 가장 높다. -->
    <div style="background-color: #f0f">첫 번재 div</div>
    <div style="color: #a00">두 번째 div</div>
    <div style="font-size: 3rem">세 번째 div</div>
  </body>
</html>
