<!doctype html>
<html>
  <head>
    <title>selector 실습</title>
    <link type="text/css" rel="stylesheet" href="../css/11_selectors.css" />
  </head>
  <body>
    <!-- heading tag h1 ~ h6 숫자가 작으면 작을수 록 글자는 커진다 -->
    <h1>Heading 1</h1>
    <h2>Heading 2</h2>
    <h3>Heading 3</h3>
    <h4>Heading 4</h4>
    <h5>Heading 5</h5>
    <h6>Heading 6</h6>

    <div id="first-div" class="tall-div">첫 번째 div 입니다</div>
    <div class="small-font-size">두 번째 div 입니다</div>

    <ul>
      <li class="italic big-font-size">첫번째 아이템</li>
      <!-- class는 띄어쓰기를 활용하여 복수개의 클래스를 부여할 수 있다 -->
      <li class="italic big-font-size">두번째 아이템</li>
      <li class="italic big-font-size">세번째 아이템</li>
    </ul>
  </body>
</html>
