<!--
<!DOCTYPE html>
"html 문서를 html5버전으로 작성하겠다"라는 선언자.

문서타입이 없다면 브라우저는 html4.01버전으로 인식

버전이 올라가면서 명령어가 재정의 되어있는것이 있기 때문에 <!DOCTYPE html>을 반드시 명시해야한다.
-->
<!doctype html>
<!-- 
    <html>
    html 파일의 전체 구조를 정의.
    메타데이터와 본문 내용을 작성하기 위한 최 상단 태그.
-->
<html>
  <!-- 
       <head> html 파일의 메타 데이터 (페이지의 이름, 스타일, 자바스크립트, 검색엔진 최적화, 문서의 언어 종류 등등.)을 정리하는 것
    -->
  <head>
    <!-- <title> 문서의 이름 - 부라우저 탭에 표시. -->
    <title>첫 번째 HTML문서 입니다.</title>

    <link
      rel="shortcut icon"
      type="image/x-icon"
      href="https://www.naver.com/favicon.ico?1"
    />
  </head>
  <!-- <body> 브라우저의 본문 내용에 표시할 컨텐츠 작성 -->
  <body>
    반갑습니다. 첫 번째 html 파일 입니다. 띄어쓰기를 여 러 번 해봅니다.
  </body>
</html>
