<!doctype html>
<html>
  <head>
    <title>이벤트 실습</title>
  </head>
  <body>
    <!--java의 system.out.println과 같다-->
    <button onclick="console.log('버튼을 클릭했습니다.')">클릭해보세요</button>
    <button ondblclick="console.log('더블클릭했습니다')">
      더블 클릭해보세요
    </button>
    <div
      onmouseover="console.log('마우스가 올라와있습니다')"
      onmouseout="console.log('마우스가 밖으로 나갔습니다.')"
    >
      마우스를 올려보세요!
    </div>
  </body>
</html>
